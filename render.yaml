services:
  - type: web
    name: trading-copilot-backend
    env: docker
    region: oregon
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: '["https://trading-copilot.vercel.app"]'  # Update with your Vercel URL
      - key: PINECONE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
