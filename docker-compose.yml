version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - CORS_ORIGINS=["http://localhost:3000"]
    env_file:
      - ./backend/.env
    networks:
      - copilot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    networks:
      - copilot-network
    depends_on:
      - backend

networks:
  copilot-network:
    driver: bridge
